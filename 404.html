<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Authentic From Within — Page not found · Coming Soon</title>
  <style>
    :root{--bg:#040607;--fg:#e7eef7;--muted:#a8b4c3;--accent:#69a8c9;}
    html,body{height:100%;margin:0}
    body{
      background: radial-gradient(1000px 700px at 50% 20%, #0e141b 0%, #070b10 55%, #040607 100%);
      color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      display:flex;align-items:center;justify-content:center; text-rendering:optimizeLegibility;
    }
    .wrap{display:flex;flex-direction:column;align-items:center;gap:22px; text-align:center; padding:32px}
    .logo-wrap{position:relative; width:min(78vw, 520px)}
    .logo-wrap img{
      width:100%; height:auto; display:block; margin:0 auto;
      filter: drop-shadow(0 0 10px rgba(105,168,201,0.55)) drop-shadow(0 0 24px rgba(105,168,201,0.25));
      animation: glow 3.6s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 10px rgba(105,168,201,0.55)) drop-shadow(0 0 24px rgba(105,168,201,0.20)); transform: translateZ(0)}
      50%     { filter: drop-shadow(0 0 18px rgba(105,168,201,0.85)) drop-shadow(0 0 36px rgba(105,168,201,0.35)); }
    }
    h1{ margin:0; font-weight:600; letter-spacing:0.4px; font-size: clamp(18px, 2.6vw, 22px); color:var(--muted)}
    .soon{ display:inline-block; margin-top:2px; padding:8px 14px; border:1px solid #1b2836; border-radius:999px;
            color:#d1dee9; background:rgba(255,255,255,0.02); font-size: clamp(14px, 2.4vw, 16px)}
    footer{ margin-top:18px; font-size:12px; color:#7a8899; opacity:0.85 }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-label="Page not found · Coming Soon">
    <div class="logo-wrap">
      <!-- Drop your logo file in this folder and name it 'logo.png' -->
      <img src="./logo.png" alt="Authentic From Within logo" />
    </div>
    <h1>Page not found · Coming Soon</h1>
    <div class="soon" aria-live="polite">A quiet space is being prepared</div>
    <footer>© <span id="y"></span> Authentic From Within · All rights reserved</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
